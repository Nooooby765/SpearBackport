# Spear Backport access transformers.
#
# A spear jab must not consume the vanilla attack meter: 1.21.11's stab goes
# through PiercingWeapon#attack, which calls
# swingAndResetAttackStrength(..., resetAttackStrength = false). 1.12.2's own
# Minecraft#clickMouse empties the meter on a click at empty air unconditionally,
# before the item is ever consulted, so refusing the click is not enough: the
# value has to be put back. The field has no public setter, hence this single
# transformation. Entries use SRG names, which is what the transformer matches.
public net.minecraft.entity.EntityLivingBase field_184617_aD # ticksSinceLastSwing
